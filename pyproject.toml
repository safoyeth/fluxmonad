[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fluxmonad"
version = "0.1.0"
description = "High-performance lazy stream processing library for Python"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Safoyeth" }
]
classifiers = [
    "Typing :: Typed",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.optional-dependencies]
all = [
    "pyyaml>=6.0",
    "openpyxl>=3.1.0",
    "tomli-w>=1.0.0; python_version < '3.11'",
]
dev = [
    "pytest>=7.4.0",
    "mypy>=1.6.0",
    "ruff>=0.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fluxmonad"]

[tool.hatch.build.targets.wheel.shared-data]
"src/fluxmonad/py.typed" = "fluxmonad/py.typed"

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true

# Игнорируем отсутствие типов у сторонних необязательных I/O-библиотек
[[tool.mypy.overrides]]
module = [
    "yaml.*",
    "openpyxl.*",
    "tomli",
    "rtoml",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]